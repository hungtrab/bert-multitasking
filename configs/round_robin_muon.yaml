_base_: round_robin_tuned.yaml
experiment_name: round_robin_muon

training:
  optimizer: muon_adamw
  # Conservative Muon fine-tuning LR. The original Muon default is often much
  # larger for training from scratch, but pretrained BERT can be damaged by
  # aggressive spectral-norm updates.
  muon_learning_rate: 0.002
  muon_momentum: 0.95
  muon_weight_decay: 0.0
  muon_ns_steps: 5
  muon_nesterov: true
