[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask-bert-v2"
version = "0.2.0"
description = "Clean refactor of the Multitask BERT NLP course project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NLP 2025.2 Group 21" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
wandb = ["wandb>=0.16"]

[project.scripts]
mtbert-train = "scripts.train:main"
mtbert-eval = "scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
